name: Bake ThreeScene gameplay into Unity YAML
on:
  push:
    branches: [main]
    paths:
      - 'tools/bake_three_scene_authored.py'
      - 'tools/expand_three_scene_authored.py'
      - 'tools/fix_three_scene_visibility.py'
      - '.github/workflows/ellen-three-scene-bake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-three-scene:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
      - name: Author new ThreeScene obstacles and validate YAML IDs
        run: |
          python3 tools/bake_three_scene_authored.py
          python3 tools/expand_three_scene_authored.py
          python3 tools/fix_three_scene_visibility.py
          git diff --check -- Assets/Scenes/ThreeScene.unity
          grep -q 'AstralCryptAuthored' Assets/Scenes/ThreeScene.unity
          grep -q 'Astral_Expansion_Barricade_01' Assets/Scenes/ThreeScene.unity
          grep -q 'Astral_Expansion_Sentinel_02' Assets/Scenes/ThreeScene.unity
      - name: Commit only ThreeScene content
        run: |
          if ! git diff --quiet -- Assets/Scenes/ThreeScene.unity; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- Assets/Scenes/ThreeScene.unity
            git commit -m "feat(level3): bake real obstacles and enemies into ThreeScene"
            git push origin HEAD:main
          fi
